<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <!-- Ces valeurs sont celles de la langue source. `provideI18n()` reprend
         `lang`, le titre, la description et le manifeste une fois la langue du
         navigateur résolue — voir `applyDocumentLang`. Les laisser remplies
         plutôt que vides donne quelque chose de correct à lire aux robots et
         au premier rendu. -->
    <title>Liste de courses</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Liste de courses partagée, hors ligne, sans serveur."
    />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#16a34a" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- iOS n'a pas de background sync : l'app se resynchronise au premier plan. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Courses" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <sl-root></sl-root>
  </body>
</html>
