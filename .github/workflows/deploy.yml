name: Intégration continue et déploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Sur `main`, un seul déploiement à la fois et on laisse finir celui en cours.
# Sur une pull request, seule la dernière version de la branche nous intéresse :
# chaque nouveau push annule la vérification encore en vol.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx nx run-many -t lint --parallel

      - name: Tests unitaires
        run: npx nx run-many -t test --parallel

      - name: Navigateurs Playwright
        run: npx playwright install chromium webkit --with-deps

      - name: Tests end-to-end
        run: npx nx e2e shopping-list-e2e

      - name: Build
        run: npx nx build shopping-list --configuration=github-pages

      - name: Préparer l'artefact Pages
        if: github.event_name != 'pull_request'
        run: |
          # GitHub Pages sert le site depuis /shared-shopping-list/. Les routes
          # profondes (…/liste) n'existent pas côté serveur : Pages renvoie
          # 404.html, qu'on fait pointer sur l'app pour que le routeur reprenne
          # la main. .nojekyll empêche Jekyll d'ignorer les fichiers en _.
          cp dist/apps/shopping-list/browser/index.html dist/apps/shopping-list/browser/404.html
          touch dist/apps/shopping-list/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/apps/shopping-list/browser

  # Une pull request s'arrête après `build` : elle valide la branche sans
  # écraser le site en ligne.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
