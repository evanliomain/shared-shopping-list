name: Intégration continue et déploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Sur `main`, un seul déploiement à la fois et on laisse finir celui en cours.
# Sur une pull request, seule la dernière version de la branche nous intéresse :
# chaque nouveau push annule la vérification encore en vol.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Le pipeline est éclaté en jobs pour se lire d'un coup d'œil : on voit lequel
# a cassé sans dérouler un journal, et les quatre vérifications tournent en
# parallèle au lieu de s'enchaîner.
#
#   installation ─┬─ lint ─────────────────────────────┐
#                 ├─ tests-unitaires ─┬─ couverture ───┤
#                 ├─ tests-e2e ───────┘                ├─ deploy
#                 └─ build ────────────────────────────┘
jobs:
  installation:
    name: Installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le `npm ci` du pipeline, payé une fois : l'action pose le cache que les
      # jobs suivants restaurent.
      - uses: ./.github/actions/preparer-node

  lint:
    name: Lint
    needs: installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparer-node

      - run: npx nx run-many -t lint --parallel

  tests-unitaires:
    name: Tests unitaires
    needs: installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparer-node

      - run: npx nx run-many -t test --parallel --coverage

      # Les deux couvertures sont relevées sur deux machines : l'artefact est à
      # la fois le seul chemin vers le job `couverture` et l'archive des `lcov`.
      - name: Archiver la couverture unitaire
        uses: actions/upload-artifact@v4
        with:
          name: couverture-unitaire
          path: coverage
          if-no-files-found: error

  tests-e2e:
    name: Tests end-to-end
    needs: installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparer-node

      - name: Navigateurs Playwright
        run: npx playwright install chromium webkit --with-deps

      - name: Tests end-to-end
        run: npx nx e2e shopping-list-e2e
        env:
          # Relève la couverture des parcours, sur les projets Chromium.
          E2E_COVERAGE: 'true'

      - name: Archiver la couverture end-to-end
        uses: actions/upload-artifact@v4
        with:
          name: couverture-e2e
          path: coverage/e2e
          if-no-files-found: error

  build:
    name: Build
    needs: installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparer-node

      - name: Build
        run: npx nx build shopping-list --configuration=github-pages

      - name: Préparer l'artefact Pages
        if: github.event_name != 'pull_request'
        run: |
          # GitHub Pages sert le site depuis /shared-shopping-list/. Les routes
          # profondes (…/liste) n'existent pas côté serveur : Pages renvoie
          # 404.html, qu'on fait pointer sur l'app pour que le routeur reprenne
          # la main. .nojekyll empêche Jekyll d'ignorer les fichiers en _.
          cp dist/apps/shopping-list/browser/index.html dist/apps/shopping-list/browser/404.html
          touch dist/apps/shopping-list/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/apps/shopping-list/browser

  # Rassemble les deux relevés en un seul tableau. Le job existe parce que les
  # tests tournent en parallèle : personne d'autre ne voit les deux moitiés.
  couverture:
    name: Rapport de couverture
    needs: [tests-unitaires, tests-e2e]
    runs-on: ubuntu-latest
    # `pull-requests: write` sert au commentaire de couverture, et à rien d'autre.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Le rapport ne lit que des JSON avec les modules de Node : pas besoin
      # des dépendances, seulement de la bonne version de Node.
      - uses: ./.github/actions/preparer-node
        with:
          node-modules: 'false'

      - name: Récupérer la couverture unitaire
        uses: actions/download-artifact@v4
        with:
          name: couverture-unitaire
          path: coverage

      - name: Récupérer la couverture end-to-end
        uses: actions/download-artifact@v4
        with:
          name: couverture-e2e
          path: coverage/e2e

      - name: Rapport de couverture
        run: |
          node tools/rapport-couverture.mjs \
            | tee "$RUNNER_TEMP/couverture.md" >> "$GITHUB_STEP_SUMMARY"

      # Un seul commentaire, réécrit à chaque push : on veut lire la couverture
      # de la branche, pas l'historique de ses allers-retours. Un fork n'a qu'un
      # jeton en lecture, donc pas de commentaire — le résumé du job reste.
      - name: Commenter la pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file "$RUNNER_TEMP/couverture.md" --edit-last --create-if-none

  # Une pull request s'arrête avant `deploy` : elle valide la branche sans
  # écraser le site en ligne. Le déploiement attend toutes les vérifications,
  # pas seulement le build : un artefact qui compile mais casse un parcours ne
  # doit pas partir en ligne.
  deploy:
    name: Déploiement
    needs: [lint, tests-unitaires, tests-e2e, couverture, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
